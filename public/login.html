<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - Maison de Beauté</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">

    <!-- Fonts matching main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-dark);
            background-image: url('assets/images/bg.jpeg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            color: var(--text-light);
            font-family: var(--font-sans);
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(18, 1, 20, 0.75) 0%, rgba(7, 0, 8, 0.95) 100%);
            z-index: 1;
        }

        /* Top Brand Header */
        .portal-header {
            position: relative;
            z-index: 2;
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        .portal-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .portal-logo img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .portal-logo span {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 40%, #edd0ed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .return-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .return-link:hover {
            color: var(--text-light);
        }

        /* Center Layout */
        .portal-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 1, 20, 0.85);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-align: center;
        }

        .card-brand-subtitle {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .card-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2.2rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .input-row {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-row input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-row input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.2);
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 0.8rem;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 2px 6px;
            transition: color 0.2s;
        }

        .pwd-toggle-btn:hover {
            color: var(--text-light);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 0.95rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: var(--text-light);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #d8b4fe 0%, var(--primary) 100%);
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
            transform: translateY(-1px);
        }

        /* Error Box */
        .error-message {
            display: none;
            margin-top: 1.2rem;
            padding: 0.75rem 1rem;
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 8px;
            color: #f87171;
            font-size: 0.85rem;
            text-align: left;
        }

        /* Subtle Demo Bar */
        .demo-bar {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border-glass);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .demo-bar code {
            color: var(--gold);
            font-family: inherit;
            font-weight: 600;
        }

        .auto-fill-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s;
        }

        .auto-fill-link:hover {
            color: var(--text-light);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="portal-header">
        <a href="/" class="portal-logo">
            <img src="assets/images/logo.png" alt="Maison de Beauté Logo">
            <span>MAISON DE BEAUTÉ</span>
        </a>
        <a href="/" class="return-link">← Return to Main Site</a>
    </header>

    <!-- Main Content -->
    <main class="portal-content">
        <div class="login-card">
            <p class="card-brand-subtitle">Maison de Beauté</p>
            <h1 class="card-title">Staff Portal</h1>
            <p class="card-desc">Sign in with your administrative account to manage appointments and schedule rosters.</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-row">
                        <input type="text" id="username" name="username" placeholder="Enter staff username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-row">
                        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" id="toggle-password-btn" class="pwd-toggle-btn">SHOW</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>

                <div id="error-box" class="error-message"></div>
            </form>

            <div class="demo-bar">
                <span>Demo: <code>admin</code> / <code>Password123</code></span>
                <a href="#" id="quick-demo-link" class="auto-fill-link">Auto-Fill</a>
            </div>
        </div>
    </main>

    <script>
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const quickDemoLink = document.getElementById("quick-demo-link");
        const togglePasswordBtn = document.getElementById("toggle-password-btn");
        const loginForm = document.getElementById("login-form");
        const submitBtn = document.getElementById("submit-btn");
        const errorBox = document.getElementById("error-box");

        // Auto-fill link handler
        if (quickDemoLink) {
            quickDemoLink.addEventListener("click", (e) => {
                e.preventDefault();
                usernameInput.value = "admin";
                passwordInput.value = "Password123";
                usernameInput.focus();
            });
        }

        // Show/Hide password handler
        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener("click", () => {
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    togglePasswordBtn.textContent = "HIDE";
                } else {
                    passwordInput.type = "password";
                    togglePasswordBtn.textContent = "SHOW";
                }
            });
        }

        // Login submit handler
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            errorBox.style.display = "none";
            errorBox.textContent = "";
            submitBtn.disabled = true;
            submitBtn.textContent = "AUTHENTICATING...";

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    submitBtn.textContent = "REDIRECTING...";
                    window.location.href = "admin.html";
                } else {
                    errorBox.textContent = data.error || "Invalid credentials.";
                    errorBox.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "SIGN IN";
                }
            } catch (err) {
                console.error("Login request failed:", err);
                errorBox.textContent = "Unable to connect to server. Please try again.";
                errorBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "SIGN IN";
            }
        });

        // Auto redirect if already authenticated
        (async () => {
            try {
                const res = await fetch("/api/admin/status");
                const data = await res.json();
                if (data.loggedIn) {
                    window.location.href = "admin.html";
                }
            } catch (e) {
                console.error(e);
            }
        })();
    </script>
</body>
</html>
